x-agent-base-common: &agent-base-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PROVIDER: ${DOCKER_PROVIDER:-all}
      CODEX_VERSION: ${CODEX_VERSION:-latest}
      GEMINI_VERSION: ${GEMINI_VERSION:-latest}
      KILO_VERSION: ${KILO_VERSION:-latest}
      OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
      HIVEMOOT_CLI_VERSION: ${HIVEMOOT_CLI_VERSION:-latest}
  image: hivemoot-agent:local
  deploy:
    resources:
      limits:
        memory: ${AGENT_MEMORY_LIMIT:-16g}
        cpus: "${AGENT_CPU_LIMIT:-4.0}"
        pids: ${AGENT_PIDS_LIMIT:-512}
  stdin_open: true
  tty: true

x-agent-base: &agent-base
  <<: *agent-base-common
  tmpfs:
    - /tmp:size=2g,mode=1777
    - /home/node/.codex:uid=1000,gid=1000,mode=0700
    - /home/node/.gemini:uid=1000,gid=1000,mode=0700
    - /home/node/.claude:uid=1000,gid=1000,mode=0700
    - /home/node/.config/claude:uid=1000,gid=1000,mode=0700
    - /home/node/.config/kilo:uid=1000,gid=1000,mode=0700
    - /home/node/.config/opencode:uid=1000,gid=1000,mode=0700
    - /home/node/.local/share/opencode:uid=1000,gid=1000,mode=0700
  volumes:
    # Scope the bind mount to the repo-specific workspace directory so the
    # container cannot access sibling workspaces or agent homes from other runs.
    # Set WORKSPACE_DATA to a repo-specific host path when running multiple repos.
    - ${WORKSPACE_DATA:-./data/repo}:${WORKSPACE_ROOT:-/workspace/repo}

x-agent-env: &agent-env
  RUN_MODE: ${RUN_MODE:-once}
  AGENT_PROVIDER: ${AGENT_PROVIDER:-claude}
  AGENT_AUTH_MODE: ${AGENT_AUTH_MODE:-api_key}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-1800}
  SESSION_RESUME: ${SESSION_RESUME:-}
  SESSION_RESUME_ENABLED: ${SESSION_RESUME_ENABLED:-1}
  SESSION_RESUME_MAX_IDLE_HOURS: ${SESSION_RESUME_MAX_IDLE_HOURS:-12}
  SESSION_RESUME_MAX_AGE_HOURS: ${SESSION_RESUME_MAX_AGE_HOURS:-24}
  WATCH_MENTIONS: ${WATCH_MENTIONS:-}
  GIT_CLONE_DEPTH: ${GIT_CLONE_DEPTH:-50}
  AGENT_MODEL: ${AGENT_MODEL:-}
  AGENT_PROMPT_FILE: ${AGENT_PROMPT_FILE:-}
  AGENT_EXTRA_PROMPT: ${AGENT_EXTRA_PROMPT:-}
  AGENT_ID_01: ${AGENT_ID_01:-}
  AGENT_ID_02: ${AGENT_ID_02:-}
  AGENT_ID_03: ${AGENT_ID_03:-}
  AGENT_ID_04: ${AGENT_ID_04:-}
  AGENT_ID_05: ${AGENT_ID_05:-}
  AGENT_ID_06: ${AGENT_ID_06:-}
  AGENT_ID_07: ${AGENT_ID_07:-}
  AGENT_ID_08: ${AGENT_ID_08:-}
