services:
  hivemoot-agent:
    <<: *agent-base
    stop_grace_period: 5m
    environment:
      <<: *agent-env
      TARGET_REPO: ${TARGET_REPO:-}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace/repo}
