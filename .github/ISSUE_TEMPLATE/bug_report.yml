name: Bug report
description: Report a bug or unexpected behavior in Hivemoot
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is broken?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic reproduction.
      placeholder: |
        1. Run command '...'
        2. Use configuration '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened? Include error messages and screenshots if relevant.
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Include platform and tool versions.
      placeholder: |
        - OS:
        - Node:
        - Hivemoot CLI:
        - Repository:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant logs or command output.

        ⚠️ Security warning: Do not include secrets, tokens, API keys, passwords, or private keys. Redact sensitive values before posting.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add any related links, prior attempts, or workarounds.
