name: Skills

on:
  push:
    branches: [main]
    paths:
      - ".agent/skills/**"
      - "scripts/validate-skills.js"
  pull_request:
    branches: [main]
    paths:
      - ".agent/skills/**"
      - "scripts/validate-skills.js"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"

      - name: Validate skill metadata and eval coverage
        run: node scripts/validate-skills.js
