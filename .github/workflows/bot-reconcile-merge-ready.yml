name: reconcile-merge-ready

on:
  schedule:
    - cron: "5,35 * * * *"  # Every 30 minutes (staggered +5 from other scripts)
  workflow_dispatch:
    # Manual trigger for testing

# Prevent overlapping runs of this workflow
concurrency:
  group: hivemoot-reconcile-merge-ready
  cancel-in-progress: false

defaults:
  run:
    working-directory: bot

jobs:
  reconcile-merge-ready:
    name: Reconcile Merge-Ready Labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run reconcile-merge-ready script
        run: npm run reconcile-merge-ready
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
