name: reconcile-pr-notifications

on:
  schedule:
    - cron: "20,50 * * * *"  # Every 30 minutes (staggered +20)
  workflow_dispatch:
    # Manual trigger for testing

# Prevent overlapping runs of this workflow
concurrency:
  group: hivemoot-reconcile-pr-notifications
  cancel-in-progress: false

defaults:
  run:
    working-directory: bot

jobs:
  reconcile-pr-notifications:
    name: Reconcile PR Notifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run reconcile-pr-notifications script
        run: npm run reconcile-pr-notifications
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
