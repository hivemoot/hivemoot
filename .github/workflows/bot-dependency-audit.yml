name: Bot Dependency Audit

# Path-scoped so non-bot edits don't re-run the npm audit.  Weekly
# cron keeps the "run on Monday" cadence inherited from hivemoot-bot
# for catching newly-published advisories even on quiet weeks.

on:
  pull_request:
    paths:
      - 'bot/**'
      - '.github/workflows/bot-dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/bot-dependency-audit.yml'
  schedule:
    - cron: "17 2 * * 1"

defaults:
  run:
    working-directory: bot

jobs:
  dependency_audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
