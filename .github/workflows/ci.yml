name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.changes.outputs.docker }}
      dockerfile: ${{ steps.changes.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: changes
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'worker/**'
              - 'shared/**'
              - 'identities/**'
              - 'integrations/**'
              - 'workloads/**'
              - '.trivyignore'
              - '.github/workflows/ci.yml'
            dockerfile:
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Run ShellCheck
        run: find compat controller worker shared scripts identities integrations workloads -name '*.sh' -print0 | xargs -0 shellcheck

  script-validation:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Verify TARGET_REPO validation behavior
        run: bash scripts/test-target-repo-validation.sh
      - name: Verify Claude token bootstrap behavior
        run: bash scripts/test-claude-token-bootstrap.sh
      - name: Verify credential storage mode behavior
        run: bash scripts/test-credential-storage-mode.sh
      - name: Verify auto auth mode with file-based secrets
        run: bash scripts/test-auto-auth-file-secrets.sh
      - name: Verify WORKSPACE_ROOT and AGENT_ID path validation behavior
        run: bash scripts/test-path-input-validation.sh
      - name: Verify Trivy ignore validation behavior
        run: bash scripts/test-trivyignore-check.sh
      - name: Verify prompt security guardrails
        run: bash scripts/test-prompt-guardrails.sh
      - name: Verify session resume lifecycle behavior
        run: bash scripts/test-session-resume-lifecycle.sh
      - name: Verify provider mismatch detection behavior
        run: bash scripts/test-provider-mismatch.sh
      - name: Verify plugin loader and dispatch guard behavior
        run: bash scripts/test-plugin-loader-guards.sh
      - name: Verify controller behavior
        run: bash scripts/test-controller.sh
      - name: Verify run-failure classification behavior
        run: bash scripts/test-classify.sh
      - name: Verify task mode behavior
        run: bash scripts/test-run-task-mode.sh
      - name: Verify run-loop next_run_at propagation behavior
        run: bash scripts/test-run-loop-next-run-at.sh
      - name: Verify health reporting env wiring
        run: bash scripts/test-health-report-env-wiring.sh
      - name: Verify health reporter contract and behavior
        run: bash scripts/test-health-reporter.sh
      - name: Verify token extractor extraction behavior
        run: bash scripts/test-token-extractor.sh
      - name: Verify plugin formatter tests
        run: python3 cli/tests/test_formatter.py
      - name: Verify engine and oneshot tests
        run: python3 cli/tests/test_engine.py
      - name: Verify all test scripts have executable bit
        run: bash scripts/test-script-executable-bits.sh

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  env-docs:
    name: Env Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Check env vars documented in .env.example
        run: |
          set -euo pipefail
          vars=$(grep -oP '\$\{\K[A-Z][A-Z0-9_]*' docker-compose.yml | sort -u)
          fail=0
          for var in $vars; do
            if ! grep -qF "$var" .env.example; then
              echo "::error::${var} is in docker-compose.yml but missing from .env.example"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All compose variables documented in .env.example"
          exit "$fail"

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265  # v19

  docker-build:
    name: Docker Build & Security Scan
    needs: [filter]
    if: needs.filter.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Build image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .
          load: true
          tags: hivemoot-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test plugin engine in built image
        run: |
          set -euo pipefail
          stderr_file="$(mktemp)"
          trap 'rm -f "$stderr_file"' EXIT

          # Verify the bash entrypoint still works (validates AGENT_WORKLOAD).
          if timeout 10 docker run --rm hivemoot-agent:ci \
            > /dev/null 2> "$stderr_file"; then
            echo "::error::entrypoint should fail without AGENT_WORKLOAD"
            exit 1
          fi
          grep -qF "AGENT_WORKLOAD" "$stderr_file"

          # Verify the Python CLI is available and plugin discovery works.
          docker run --rm --entrypoint hivemoot-agent hivemoot-agent:ci plugin list 2>&1 | grep -qF "messaging"
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: hivemoot-agent:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Create empty trivyignore for unfiltered scan
        run: |
          : > .trivyignore.empty
      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: hivemoot-agent:ci
          format: json
          output: trivy-report.json
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.empty
      - name: Check for stale Trivy suppressions
        run: scripts/check-trivyignore.sh .trivyignore trivy-report.json

  docker-provider-stages:
    name: Provider Stage Build (${{ matrix.provider }})
    needs: [filter]
    if: needs.filter.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: codex
            cli: codex
          - provider: gemini
            cli: gemini
          - provider: kilo
            cli: kilo
          - provider: opencode
            cli: opencode
          - provider: claude
            cli: claude
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Build provider-${{ matrix.provider }} image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .
          load: true
          tags: hivemoot-agent:ci-${{ matrix.provider }}
          build-args: PROVIDER=${{ matrix.provider }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify ${{ matrix.cli }} CLI is present
        run: |
          docker run --rm --entrypoint /bin/sh \
            hivemoot-agent:ci-${{ matrix.provider }} \
            -c 'command -v ${{ matrix.cli }}'
