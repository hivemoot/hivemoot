name: reconcile-repository-labels

on:
  schedule:
    - cron: "20 3 * * *"  # Daily at 03:20 UTC (staggered from other scheduled scripts)
  workflow_dispatch:
    # Manual trigger for testing

# Prevent overlapping runs of this workflow
concurrency:
  group: hivemoot-reconcile-repository-labels
  cancel-in-progress: false

defaults:
  run:
    working-directory: bot

jobs:
  reconcile-repository-labels:
    name: Reconcile Repository Labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run reconcile-repository-labels script
        run: npm run reconcile-repository-labels
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
