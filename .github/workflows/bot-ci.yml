name: Bot CI

# Ported from hivemoot-bot's ci.yml under the monorepo consolidation.
# The deploy job moved to bot-deploy.yml (workflow_run on "Bot CI")
# so Vercel commands run from the repo root — otherwise the bot CWD
# plus Vercel's Root Directory = bot/ would double-resolve to bot/bot/,
# the bug web-deploy fixed in PR #109.  Path-scoped at the trigger
# level so unrelated edits (web/, agent/, cli/, docs/) don't fire
# this pipeline.

on:
  pull_request:
    paths:
      - 'bot/**'
      - '.github/workflows/bot-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/bot-ci.yml'

permissions:
  contents: read

defaults:
  run:
    # All `run:` steps execute inside bot/ so npm's package-lock,
    # scripts, and test fixtures keep their original relative shape.
    # `uses:` actions don't respect this; those pass cache paths and
    # working-directory explicitly where needed.
    working-directory: bot

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test_typecheck:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  coverage_gate:
    name: Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          files: ./bot/coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
