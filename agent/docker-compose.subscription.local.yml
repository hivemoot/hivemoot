x-agent-base-subscription: &agent-base-subscription
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PROVIDER: ${DOCKER_PROVIDER:-all}
      CODEX_VERSION: ${CODEX_VERSION:-latest}
      GEMINI_VERSION: ${GEMINI_VERSION:-latest}
      KILO_VERSION: ${KILO_VERSION:-latest}
      OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
      HIVEMOOT_CLI_VERSION: ${HIVEMOOT_CLI_VERSION:-latest}
  image: hivemoot-agent:local
  deploy:
    resources:
      limits:
        memory: ${AGENT_MEMORY_LIMIT:-16g}
        cpus: "${AGENT_CPU_LIMIT:-4.0}"
        pids: ${AGENT_PIDS_LIMIT:-512}
  stdin_open: true
  tty: true
  tmpfs:
    - /tmp:size=2g,mode=1777
  volumes:
    # Scope the bind mount to the repo-specific workspace directory so the
    # container cannot access sibling workspaces or agent homes from other runs.
    # Set WORKSPACE_DATA to a repo-specific host path when running multiple repos.
    - ${WORKSPACE_DATA:-./data/repo}:${WORKSPACE_ROOT:-/workspace/repo}
    - codex-home:/home/node/.codex
    - gemini-home:/home/node/.gemini
    - claude-home:/home/node/.claude
    - claude-config:/home/node/.config/claude
    - kilo-config:/home/node/.config/kilo
    - opencode-config:/home/node/.config/opencode
    - opencode-data:/home/node/.local/share/opencode

services:
  hivemoot-agent-subscription:
    <<: *agent-base-subscription
    stop_grace_period: 5m
    env_file:
      - .env
    environment:
      AGENT_AUTH_MODE: subscription
      TARGET_REPO: ${TARGET_REPO:-}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace/repo}

  auth-codex:
    <<: *agent-base-subscription
    env_file:
      - .env
    entrypoint: ["codex", "login", "--device-auth"]

  auth-gemini:
    <<: *agent-base-subscription
    env_file:
      - .env
    entrypoint: ["gemini"]

  auth-claude:
    <<: *agent-base-subscription
    env_file:
      - .env
    entrypoint: ["claude"]

  auth-claude-token:
    <<: *agent-base-subscription
    env_file:
      - .env
    entrypoint: ["bash", "-lc"]
    command:
      - |
        set -euo pipefail
        claude setup-token
        cat > "${HOME}/.claude.json" <<'JSON'
        {"hasCompletedOnboarding": true}
        JSON
        echo "Token setup complete. Persist ${HOME}/.claude/.credentials.json and ${HOME}/.claude.json."

  auth-kilo:
    <<: *agent-base-subscription
    env_file:
      - .env
    entrypoint: ["kilo", "auth", "login"]

volumes:
  codex-home:
  gemini-home:
  claude-home:
  claude-config:
  kilo-config:
  opencode-config:
  opencode-data:
